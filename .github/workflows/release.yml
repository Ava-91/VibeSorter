name: Tagged release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "src-tauri/**"
      - "src/vibesorter/**"
      - "scripts/**"
      - "tests/**"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and release tooling
        run: python -m pip install -e ".[dev]" build
      - name: Run lint and full test suite
        run: |
          ruff check .
          python -m pytest
      - name: Verify tag matches every version declaration and is on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Accepts only vX.Y.Z and vX.Y.Z-rc.N; see scripts/release_version.py for the
          # PEP 440 / Cargo / Tauri spellings of release candidates.
          python scripts/release_version.py --tag "$RELEASE_TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build Python wheel and source archive
        run: python -m build --outdir python-dist
      - name: Upload Python distributions
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: vibesorter-python-dist
          path: python-dist/*
          if-no-files-found: error

  # Run platform-independent desktop tests once; native packaging remains a full OS matrix.
  desktop-tests:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test desktop event and progress regressions
        run: node --test tests/desktop_progress.test.cjs
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Run Tauri lifecycle unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python package
        run: python -m pip install -e .
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build VibeSorter sidecar
        run: python scripts/build_sidecar.py
      - name: Cache Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2.12.4-${{ runner.os }}-${{ runner.arch }}
      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Verify Tauri CLI
        run: cargo tauri --version
      - name: Generate Tauri app icons
        run: cargo tauri icon src-tauri/app-icon.svg
      - name: Smoke-test packaged sidecar CLI
        shell: python
        run: |
          import platform
          import subprocess
          from pathlib import Path

          target = subprocess.check_output(["rustc", "--print", "host-tuple"], text=True).strip()
          extension = ".exe" if platform.system() == "Windows" else ""
          binary = Path("src-tauri") / "binaries" / f"vibesorter-sidecar-{target}{extension}"
          result = subprocess.run([str(binary), "--help"], capture_output=True, text=True, timeout=30)
          if result.returncode != 0:
              raise SystemExit(result.stderr or f"sidecar exited with {result.returncode}")
          print("Packaged sidecar CLI help command succeeded.")
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --target ${{ matrix.target }}
      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vibesorter-windows
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: vibesorter-macos
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Upload Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vibesorter-linux
          path: |
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error

  publish-draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, desktop-tests, build-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Validate assets and create SHA-256 checksums
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("release-assets")
          files = [path for path in root.rglob("*") if path.is_file()]
          if not files:
              raise SystemExit("No release assets were downloaded.")
          if any(path.stat().st_size == 0 for path in files):
              raise SystemExit("A release asset is empty.")
          groups = {
              "Windows installer": any(path.suffix.lower() in {".exe", ".msi"} for path in root.glob("vibesorter-windows/**/*")),
              "macOS DMG": any(path.suffix.lower() == ".dmg" for path in root.glob("vibesorter-macos/**/*")),
              "Linux AppImage or DEB": any(path.suffix.lower() in {".appimage", ".deb"} for path in root.glob("vibesorter-linux/**/*")),
              "Python wheel": any(path.suffix.lower() == ".whl" for path in root.glob("vibesorter-python-dist/**/*")),
              "Python source archive": any(path.name.endswith(".tar.gz") for path in root.glob("vibesorter-python-dist/**/*")),
          }
          missing = [name for name, present in groups.items() if not present]
          if missing:
              raise SystemExit(f"Missing required release assets: {missing}")
          print(f"Validated {len(files)} non-empty release assets.")
          PY
          find release-assets -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: VibeSorter ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*
            SHA256SUMS
