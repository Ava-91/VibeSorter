name: Desktop

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "desktop-ui/**"
      - "scripts/**"
      - ".github/workflows/desktop.yml"
      - "pyproject.toml"
      - "src/vibesorter/**"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "desktop-ui/**"
      - "scripts/**"
      - ".github/workflows/desktop.yml"
      - "pyproject.toml"
      - "src/vibesorter/**"

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python package
        run: python -m pip install -e .
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Generate Tauri app icons
        run: cargo tauri icon src-tauri/app-icon.svg
      - name: Build VibeSorter sidecar
        run: python scripts/build_sidecar.py
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --target ${{ matrix.target }}

      - name: Inspect desktop bundle sizes
        shell: python
        run: |
          from pathlib import Path

          bundle_root = Path("src-tauri/target")
          files = [
              p for p in bundle_root.glob("**/release/bundle/**/*")
              if p.is_file()
          ]

          print("=== DESKTOP BUNDLES ===")
          for path in sorted(files, key=lambda p: p.stat().st_size, reverse=True):
              size = path.stat().st_size
              print(f"{size / 1024 / 1024:8.2f} MiB  {path}")

          print("\n=== SIDECAR ===")
          for root in (Path("src-tauri/binaries"), Path("dist")):
              if root.exists():
                  for path in sorted(
                      (p for p in root.rglob("*") if p.is_file()),
                      key=lambda p: p.stat().st_size,
                      reverse=True,
                  ):
                      print(f"{path.stat().st_size / 1024 / 1024:8.2f} MiB  {path}")

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: vibesorter-${{ matrix.os }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error
