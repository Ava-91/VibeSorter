            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) { throw "Upgraded app exited during startup with code $($process.ExitCode)." }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Uninstall the Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'vibesorter-clean-install'
          $uninstaller = Get-ChildItem $installRoot -Recurse -File -Filter 'uninstall.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Silent uninstaller was not found.' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/S') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)." }
          Start-Sleep -Seconds 2
          $remainingApp = Get-ChildItem $installRoot -Recurse -File -Filter 'vibesorter-desktop.exe' -ErrorAction SilentlyContinue
          if ($remainingApp) { throw 'Application executable remains after uninstall.' }

      - name: Inspect desktop bundle sizes
        shell: python
        run: |
          from pathlib import Path

          bundle_root = Path("src-tauri/target")
          files = [
              p for p in bundle_root.glob("**/release/bundle/**/*")
              if p.is_file()
          ]

          print("=== DESKTOP BUNDLES ===")
          for path in sorted(files, key=lambda p: p.stat().st_size, reverse=True):
              size = path.stat().st_size
              print(f"{size / 1024 / 1024:8.2f} MiB  {path}")

          print("\n=== SIDECAR ===")
          for root in (Path("src-tauri/binaries"), Path("dist")):
              if root.exists():
                  for path in sorted(
                      (p for p in root.rglob("*") if p.is_file()),
                      key=lambda p: p.stat().st_size,
                      reverse=True,
                  ):
                      print(f"{path.stat().st_size / 1024 / 1024:8.2f} MiB  {path}")

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vibesorter-windows
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: vibesorter-macos
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vibesorter-linux
          path: |
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-release, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download platform and Python artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Verify expected release assets and generate checksums
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("release-assets")
          files = [path for path in root.rglob("*") if path.is_file()]
          if not files:
              raise SystemExit("No release assets were downloaded.")
          if any(path.stat().st_size == 0 for path in files):
              raise SystemExit("A release asset is empty.")
          groups = {
              "Windows installer": any(path.suffix.lower() in {".exe", ".msi"} for path in root.glob("vibesorter-windows/**/*")),
              "macOS DMG": any(path.suffix.lower() == ".dmg" for path in root.glob("vibesorter-macos/**/*")),
              "Linux AppImage or DEB": any(path.suffix.lower() in {".appimage", ".deb"} for path in root.glob("vibesorter-linux/**/*")),
              "Python wheel": any(path.suffix.lower() == ".whl" for path in root.glob("vibesorter-python-dist/**/*")),
              "Python source archive": any(path.name.endswith(".tar.gz") for path in root.glob("vibesorter-python-dist/**/*")),
          }
          missing = [name for name, present in groups.items() if not present]
          if missing:
              raise SystemExit(f"Missing required release assets: {missing}")
          print(f"Validated {len(files)} non-empty release assets.")
          PY
          find release-assets -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Create draft GitHub release with checksums
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: VibeSorter ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*
            SHA256SUMS
