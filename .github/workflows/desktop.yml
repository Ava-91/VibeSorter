name: Desktop

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "desktop-ui/**"
      - "scripts/**"
      - ".github/workflows/desktop.yml"
      - "pyproject.toml"
      - "src/vibesorter/**"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "desktop-ui/**"
      - "scripts/**"
      - ".github/workflows/desktop.yml"
      - "pyproject.toml"
      - "src/vibesorter/**"

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js for desktop frontend regression tests
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test desktop progress event parser
        run: node --test tests/desktop_progress.test.cjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python package
        run: python -m pip install -e .
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Generate Tauri app icons
        run: cargo tauri icon src-tauri/app-icon.svg
      - name: Build VibeSorter sidecar
        run: python scripts/build_sidecar.py
      - name: Smoke-test packaged sidecar CLI
        shell: python
        run: |
          import platform
          import subprocess
          from pathlib import Path

          target = subprocess.check_output(
              ["rustc", "--print", "host-tuple"], text=True
          ).strip()
          extension = ".exe" if platform.system() == "Windows" else ""
          binary = Path("src-tauri") / "binaries" / f"vibesorter-sidecar-{target}{extension}"
          result = subprocess.run(
              [str(binary), "--help"],
              capture_output=True,
              text=True,
              timeout=30,
          )
          if result.returncode != 0:
              raise SystemExit(result.stderr or f"sidecar exited with {result.returncode}")
          print("Packaged sidecar CLI help command succeeded.")
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --target ${{ matrix.target }}

      - name: Install and launch Windows installer in a clean directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target' -Recurse -File -Filter '*.exe' |
            Where-Object { $_.FullName -match '[\\/]release[\\/]bundle[\\/]nsis[\\/]' } |
            Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }

          $installRoot = Join-Path $env:RUNNER_TEMP 'vibesorter-clean-install'
          if (Test-Path $installRoot) { Remove-Item $installRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $installRoot | Out-Null

          # NSIS supports /S for silent installation and /D as its final argument.
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)." }

          # Tauri's executable name follows the Rust package name, not productName.
          $app = Get-ChildItem $installRoot -Recurse -File -Filter 'vibesorter-desktop.exe' | Select-Object -First 1
          if (-not $app) {
            Get-ChildItem $installRoot -Recurse -File | Select-Object FullName | Format-Table -AutoSize | Out-String | Write-Host
            throw "Installed vibesorter-desktop.exe was not found under $installRoot."
          }

          $process = Start-Process -FilePath $app.FullName -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) { throw "Installed app exited during startup with code $($process.ExitCode)." }
            Write-Host "Clean-install smoke test passed: $($app.FullName) stayed running for 8 seconds."
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Upgrade the installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target' -Recurse -File -Filter '*.exe' |
            Where-Object { $_.FullName -match '[\\\\/]release[\\\\/]bundle[\\\\/]nsis[\\\\/]' } |
            Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced for upgrade test.' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'vibesorter-clean-install'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Upgrade/reinstall failed with exit code $($install.ExitCode)." }
          $app = Get-ChildItem $installRoot -Recurse -File -Filter 'vibesorter-desktop.exe' | Select-Object -First 1
          if (-not $app) { throw 'Application executable missing after upgrade/reinstall.' }
          $process = Start-Process -FilePath $app.FullName -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) { throw "Upgraded app exited during startup with code $($process.ExitCode)." }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Uninstall the Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'vibesorter-clean-install'
          $uninstaller = Get-ChildItem $installRoot -Recurse -File -Filter 'uninstall.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Silent uninstaller was not found.' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/S') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)." }
          Start-Sleep -Seconds 2
          $remainingApp = Get-ChildItem $installRoot -Recurse -File -Filter 'vibesorter-desktop.exe' -ErrorAction SilentlyContinue
          if ($remainingApp) { throw 'Application executable remains after uninstall.' }

      - name: Inspect desktop bundle sizes
        shell: python
        run: |
          from pathlib import Path

          bundle_root = Path("src-tauri/target")
          files = [
              p for p in bundle_root.glob("**/release/bundle/**/*")
              if p.is_file()
          ]

          print("=== DESKTOP BUNDLES ===")
          for path in sorted(files, key=lambda p: p.stat().st_size, reverse=True):
              size = path.stat().st_size
              print(f"{size / 1024 / 1024:8.2f} MiB  {path}")

          print("\n=== SIDECAR ===")
          for root in (Path("src-tauri/binaries"), Path("dist")):
              if root.exists():
                  for path in sorted(
                      (p for p in root.rglob("*") if p.is_file()),
                      key=lambda p: p.stat().st_size,
                      reverse=True,
                  ):
                      print(f"{path.stat().st_size / 1024 / 1024:8.2f} MiB  {path}")

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vibesorter-windows
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: vibesorter-macos
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vibesorter-linux
          path: |
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error
