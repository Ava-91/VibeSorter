name: PR automation

on:
  pull_request:
    types: [opened, reopened, closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-automation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assign-and-label:
    runs-on: ubuntu-latest
    steps:
      - name: Assign Ava and apply labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const number = pr.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Additive assignment: preserve any existing assignees.
            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: number,
              assignees: ['Ava-91'],
            });

            const labels = [
              { name: 'pull-request', color: '1D76DB', description: 'Pull request' },
              { name: 'automation', color: '0E8A16', description: 'Handled by repository automation' },
            ];

            if (context.payload.action === 'closed') {
              labels.push(
                pr.merged
                  ? { name: 'merged', color: '6F42C1', description: 'Pull request was merged' }
                  : { name: 'closed', color: 'B60205', description: 'Pull request was closed without merging' }
              );
            } else {
              labels.push({ name: 'open', color: 'FBCA04', description: 'Pull request is open' });
            }

            // Create standard labels if the repository does not have them yet.
            const existing = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { owner, repo, per_page: 100 }
            );
            const existingNames = new Set(existing.map(label => label.name));

            for (const label of labels) {
              if (!existingNames.has(label.name)) {
                try {
                  await github.rest.issues.createLabel({ owner, repo, ...label });
                  existingNames.add(label.name);
                } catch (error) {
                  if (error.status !== 422) throw error;
                }
              }
            }

            // Add labels without removing labels already applied by Dependabot or maintainers.
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: number,
              labels: labels.map(label => label.name),
            });

            core.info(`Assigned Ava-91 and applied labels to PR #${number} (${context.payload.action}).`);
