name: VibeSorter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Apply Ruff fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/ruff-errors'
        run: ruff check . --fix

      - name: Commit Ruff fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/ruff-errors'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No Ruff fixes to commit."
          else
            git commit -m "style: apply Ruff autofixes"
            git push
          fi

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest
