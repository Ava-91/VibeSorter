<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VibeSorter</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,Segoe UI,system-ui,sans-serif;background:#0d0e12;color:#f4f5f7}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0e12}
    main{width:min(760px,calc(100% - 48px));padding:36px;border:1px solid #2b3040;border-radius:14px;background:#12151d}
    .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8b96ad}
    h1{font-size:42px;margin:8px 0}
    p{color:#aeb3c2;line-height:1.6}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}
    button{border:1px solid #343b52;background:#1a1f2c;color:#fff;border-radius:12px;padding:12px 16px;font:inherit;cursor:pointer}
    button.primary{background:#5968e8;border-color:#5968e8}
    button.danger{border-color:#6f3341}
    button:disabled{opacity:.5;cursor:wait}
    .path{padding:12px 14px;border-radius:10px;background:#0d1017;color:#cbd0dc;word-break:break-all;min-height:42px}
    .status{margin-top:18px;padding:14px;border:1px solid #292e3d;border-radius:12px;color:#aeb3c2;white-space:pre-wrap;min-height:72px}
    .privacy{font-size:13px}
    .privacy strong{color:#d8dcff}
    .hidden{display:none}
    main.results-open{width:calc(100% - 32px);max-width:none;margin:16px auto;padding:24px}
    .results-shell{margin-top:22px;border-top:1px solid #292e3d;padding-top:18px}
    .results-shell[hidden]{display:none}
    .results-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .results-frame{display:block;width:100%;height:min(68vh,900px);min-height:420px;border:1px solid #343b52;border-radius:8px;background:#0d0e12}
    @media(max-width:640px){main.results-open{padding:16px}.results-frame{height:65vh;min-height:320px}}
  </style>
</head>
<body>
<main>
  <div class="eyebrow">Local-first desktop</div>
  <h1>VibeSorter</h1>
  <p>Analyze and browse your image library without sending source images to a cloud service.</p>

  <div class="actions">
    <button id="choose" class="primary">Choose image folder</button>
    <button id="analyze" disabled>Analyze folder</button>
    <button id="cancel" class="danger hidden">Cancel analysis</button>
    <button id="browse" class="hidden">Browse results</button>
  </div>

  <div id="path" class="path">No folder selected.</div>
  <div id="status" class="status" role="status" aria-live="polite">Ready.</div>
  <section id="results-shell" class="results-shell" hidden aria-label="Analysis results">
    <div class="results-toolbar">
      <strong>Local analysis results</strong>
      <button id="hide-results" type="button">Hide results</button>
    </div>
    <iframe id="results-frame" class="results-frame" title="VibeSorter image results" referrerpolicy="no-referrer"></iframe>
  </section>
  <p class="privacy"><strong>Privacy:</strong> images and analysis stay on this device. VibeSorter does not upload your library to a third-party AI service.</p>
</main>

<script src="progress.js"></script>
<script>
const tauri = window.__TAURI__;
const { invoke } = tauri.core;
const { listen } = tauri.event;

let folder = null;
let browserUrl = null;
let analysisRunning = false;
const progressParser = window.VibeSorterProgress.createLineParser(handleProgressLine);

const choose = document.getElementById("choose");
const analyze = document.getElementById("analyze");
const cancel = document.getElementById("cancel");
const path = document.getElementById("path");
const status = document.getElementById("status");
const browse = document.getElementById("browse");
const resultsShell = document.getElementById("results-shell");
const resultsFrame = document.getElementById("results-frame");
const hideResults = document.getElementById("hide-results");
const appMain = document.querySelector("main");

function setStatus(message){ status.textContent = message; }

function setResultsVisible(visible){
  resultsShell.hidden = !visible;
  appMain.classList.toggle("results-open", visible);
  browse.textContent = visible ? "Hide results" : "Browse results";
  if (visible && browserUrl) {
    // Reload each time so the view sees the latest completed local index.
    resultsFrame.src = browserUrl + "/?desktop-refresh=" + Date.now();
  }
}

function handleProgressLine(line){
  if (!line.trim()) return;
  let result;
  try { result = JSON.parse(line); }
  catch { console.debug("VibeSorter backend output:", line); return; }
  if (result.type !== "progress") return;
  if (result.phase === "scan") {
    setStatus(`Scanning folder… ${result.total ?? 0} image(s) found.`);
  } else if (result.phase === "analyze") {
    const completed = result.completed ?? 0;
    const total = result.total ?? 0;
    const suffix = total ? ` ${completed}/${total}` : "";
    setStatus(`Analyzing locally…${suffix}`);
  } else if (result.phase === "complete") {
    setStatus(`Analysis complete. Analyzed: ${result.analyzed ?? 0} · Reused: ${result.reused ?? 0} · Skipped: ${result.skipped ?? 0}`);
  }
}

function setRunning(running){
  analysisRunning = running;
  if (running) {
    browse.classList.add("hidden");
    setResultsVisible(false);
  }
  choose.disabled = running;
  analyze.disabled = running || !folder;
  cancel.classList.toggle("hidden", !running);
  // A previous cancellation must not leave the next run's button disabled.
  cancel.disabled = false;
}

browse.addEventListener("click", () => {
  if (!browserUrl) return;
  setResultsVisible(resultsShell.hidden);
  if (!resultsShell.hidden) setStatus("Showing results from the local analysis database.");
});
hideResults.addEventListener("click", () => setResultsVisible(false));

listen("analysis-output", (event) => {
  progressParser.push(String(event.payload ?? ""));
});

listen("analysis-diagnostic", (event) => {
  // stderr can contain harmless warnings; only the child exit code decides success.
  console.warn("VibeSorter analysis diagnostic:", event.payload);
});

listen("analysis-error", (event) => {
  setStatus("Analysis error:\n" + event.payload);
  setRunning(false);
  choose.disabled = false;
});

listen("analysis-failed", (event) => {
  setStatus("Analysis failed" + (event.payload ? " (exit code " + event.payload + ")." : "."));
  setRunning(false);
  choose.disabled = false;
});

listen("analysis-cancelled", () => {
  setStatus("Analysis cancelled. No cloud upload occurred.");
  setRunning(false);
});

listen("analysis-finished", () => {
  progressParser.flush();
  setRunning(false);
  browse.classList.toggle("hidden", !browserUrl);
  setStatus("Analysis complete. Your local results are ready to browse.");
});

choose.addEventListener("click", async () => {
  try {
    const selected = await invoke("choose_folder");
    if (!selected) return;
    folder = selected;
    path.textContent = folder;
    analyze.disabled = false;
    setStatus("Folder selected. Start local analysis when ready.");
  } catch (error) {
    setStatus("Could not choose a folder: " + error);
  }
});

analyze.addEventListener("click", async () => {
  if (!folder || analysisRunning) return;
  setRunning(true);
  choose.disabled = true;
  setStatus("Starting local VibeSorter backend…");

  try {
    browserUrl = await invoke("start_backend", { folder, port: 0 });
    await invoke("index_folder", { folder });
    setStatus("Analyzing locally… You can cancel safely at any time.");
  } catch (error) {
    setStatus("Could not start VibeSorter:\n" + error);
    choose.disabled = false;
    setRunning(false);
  }
});

cancel.addEventListener("click", async () => {
  if (!analysisRunning) return;
  cancel.disabled = true;
  setStatus("Cancelling local analysis…");
  try {
    await invoke("cancel_index");
  } catch (error) {
    setStatus("Could not cancel analysis: " + error);
    cancel.disabled = false;
  }
});
</script>
</body>
</html>
