[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesorter"
version = "0.1.0"
description = "A local, lightweight image organizer that groups photos by visual vibes."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Ava"}]
dependencies = []

[project.scripts]
vibesorter = "vibesorter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
