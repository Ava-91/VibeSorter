[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesorter"
version = "0.3.0"
description = "A local, lightweight image organizer that groups photos by visual vibes."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Ava"}]
dependencies = ["Pillow>=10.0"]

[project.scripts]
vibesorter = "vibesorter.entrypoint:main"
vibesorter-browser = "vibesorter.browser.server:main"
vibesorter-desktop = "vibesorter.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
# Image analysis intentionally catches decoder-specific exceptions so one bad image can be skipped.
"src/vibesorter/cli.py" = ["BLE001"]
"src/vibesorter/indexer.py" = ["BLE001"]
# Invalid proposal structure is reported as ValueError because the JSON value has the wrong shape.
"src/vibesorter/gallery.py" = ["TRY004"]
