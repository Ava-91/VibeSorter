[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesorter"
version = "0.3.0"
description = "A local, lightweight image organizer that groups photos by visual vibes."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Ava"}]
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
vibesorter = "vibesorter.entrypoint:main"
vibesorter-browser = "vibesorter.browser.server:main"
vibesorter-desktop = "vibesorter.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
# Image analysis intentionally catches decoder-specific exceptions so one bad image can be skipped.
"src/vibesorter/cli.py" = ["BLE001"]
"src/vibesorter/indexer.py" = ["BLE001"]
# Invalid proposal structure is reported as ValueError because the JSON value has the wrong shape.
"src/vibesorter/gallery.py" = ["TRY004"]
# These test assertions intentionally use compact idioms flagged only by optional style rules.
"tests/test_vibes.py" = ["C402", "I001"]
# Browser keeps an argparse import for its CLI entrypoint compatibility surface.
"src/vibesorter/browser/server.py" = ["F401"]
# The taxonomy validation import is intentionally grouped by contract role.
"src/vibesorter/profile.py" = ["I001"]
"tests/test_taxonomy_end_to_end.py" = ["I001"]
# Canonical scorer keeps a named RGB component for future heuristic expansion.
"src/vibesorter/vibes.py" = ["F841"]
