[package]
name = "vibesorter-desktop"
version = "0.1.0"
description = "Tauri desktop application for VibeSorter"
authors = ["Ava"]
edition = "2021"

[lib]
name = "vibesorter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
